global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'wsl-node-exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: 'wsl2-local'
          environment: 'development'

  - job_name: 'cozyroom'
    static_configs:
      - targets: ['localhost:18080']
        labels:
          instance: 'cozyroom'
          environment: 'production'

  - job_name: 'cloudflared'
    static_configs:
      - targets: ['localhost:2000']
        labels:
          instance: 'homelab-tunnel'

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['localhost:9091']
