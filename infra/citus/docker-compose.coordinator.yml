services:
  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: citus-coordinator
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cozyroom
      POSTGRES_USER: cozyroom
      POSTGRES_PASSWORD: ${CITUS_PASSWORD}
    volumes:
      - /var/lib/citus-coordinator:/var/lib/postgresql/data
      - ./init-coordinator.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: citus-worker-1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cozyroom
      POSTGRES_USER: cozyroom
      POSTGRES_PASSWORD: ${CITUS_PASSWORD}
    volumes:
      - /var/lib/citus-worker-1:/var/lib/postgresql/data
    restart: unless-stopped
