---
# Secret chứa tunnel credentials — tạo 1 lần:
# kubectl create secret generic cloudflared-credentials \
#   --from-file=credentials.json=$HOME/.cloudflared/7864124d-5b4d-4d29-8e16-0192e6ed65a9.json \
#   -n cozyroom-k8s
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cozyroom-k8s
data:
  config.yml: |
    tunnel: homelab
    credentials-file: /etc/cloudflared/credentials.json
    protocol: http2
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      - hostname: music.giatbh.io.vn
        service: http://frontend.cozyroom-k8s.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cozyroom-k8s
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Spread 2 replicas across different nodes (VNPT + Viettel)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - run
          ports:
            - containerPort: 2000
              name: metrics
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yml
              subPath: config.yml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflared-credentials
