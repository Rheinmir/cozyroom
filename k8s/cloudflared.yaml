---
# Secret chứa tunnel credentials — tạo 1 lần:
# kubectl create secret generic cloudflared-credentials \
#   --from-file=credentials.json=$HOME/.cloudflared/7864124d-5b4d-4d29-8e16-0192e6ed65a9.json \
#   -n cozyroom-k8s
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cozyroom-k8s
data:
  config.yml: |
    tunnel: homelab
    credentials-file: /etc/cloudflared/credentials.json
    protocol: http2
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      - hostname: music.giatbh.io.vn
        service: http://frontend.cozyroom-k8s.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cozyroom-k8s
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Spread 2 replicas across healthy nodes only (rhein-e2144g has broken networking)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rhein-e2144g-p630-16-256
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cloudflared
                topologyKey: kubernetes.io/hostname
      containers:
        - name: proxy
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              printf 'server {\n  listen 18080;\n  proxy_buffering off;\n  proxy_request_buffering off;\n  location / {\n    proxy_pass http://frontend.cozyroom-k8s.svc.cluster.local:80;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_read_timeout 300s;\n    proxy_send_timeout 300s;\n  }\n}\n' > /etc/nginx/conf.d/proxy.conf
              nginx -g 'daemon off;'
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - run
          ports:
            - containerPort: 2000
              name: metrics
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yml
              subPath: config.yml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflared-credentials
