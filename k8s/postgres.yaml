apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-pgdata
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  hostPath:
    path: /var/lib/k8s-pgdata
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [rhein-13700hxes-4070-64-4t]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: cozyroom-k8s
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: k8s-pgdata
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cozyroom-k8s
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: rhein-13700hxes-4070-64-4t
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=5
            - -c
            - wal_keep_size=256
            - -c
            - hot_standby=on
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            - name: POSTGRES_DB
              value: cozyroom
            - name: POSTGRES_USER
              value: cozyroom
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cozyroom-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: pg-hba
              mountPath: /etc/postgresql
          readinessProbe:
            exec:
              command: [pg_isready, -U, cozyroom]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0755
        - name: pg-hba
          configMap:
            name: postgres-hba
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cozyroom-k8s
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
