apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cozyroom-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: rhein-k8s-s2-2698bv3-k620-8-128
      containers:
        - name: frontend
          image: 100.88.197.64:5000/cozyroom-frontend:k8s
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cozyroom-k8s
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
