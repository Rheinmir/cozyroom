apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloak-proxy
  namespace: cozyroom-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloak-proxy
  template:
    metadata:
      labels:
        app: cloak-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: rhein-k8s-s2-2698bv3-k620-8-128
      containers:
        - name: cloak-proxy
          image: 100.88.197.64:5000/cozyroom-cloak:k8s
          ports:
            - containerPort: 8765
---
apiVersion: v1
kind: Service
metadata:
  name: cloak-proxy
  namespace: cozyroom-k8s
spec:
  selector:
    app: cloak-proxy
  ports:
    - port: 8765
      targetPort: 8765
