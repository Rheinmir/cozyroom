# DB Adapter — HAProxy round-robin across 3 bare-metal CockroachDB nodes
# (Tailscale mesh, insecure mode). Replaces the PgBouncer→Postgres pooler as
# part of the CockroachDB migration (see llmwiki postmortem/proposal
# 100726-cockroachdb-migration-db.md). Service name + port 5432 kept
# unchanged so backend's DATABASE_URL (db-adapter:5432) needs no edit.
# ROLLBACK: `kubectl apply -f k8s/db-adapter.yaml.postgres-backup` restores
# the PgBouncer→Postgres version — Postgres itself is untouched and still running.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-adapter-haproxy-config
  namespace: cozyroom-k8s
data:
  haproxy.cfg: |
    global
        maxconn 5000
        log stdout format raw local0

    defaults
        mode tcp
        timeout connect 5s
        timeout client 300s
        timeout server 300s
        log global

    frontend cozyroom_db
        bind *:5432
        default_backend crdb_nodes

    backend crdb_nodes
        balance roundrobin
        option tcp-check
        server crdb1 100.88.197.64:26257 check inter 3s fall 2 rise 2
        server crdb2 100.97.8.41:26257 check inter 3s fall 2 rise 2
        server crdb3 100.114.107.68:26257 check inter 3s fall 2 rise 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-adapter
  namespace: cozyroom-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db-adapter
  template:
    metadata:
      labels:
        app: db-adapter
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rhein-e2144g-p630-16-256
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: db-adapter
                topologyKey: kubernetes.io/hostname
      containers:
        - name: haproxy
          image: haproxy:2.9-alpine
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: haproxy-config
          configMap:
            name: db-adapter-haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: db-adapter
  namespace: cozyroom-k8s
spec:
  selector:
    app: db-adapter
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
