apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-pgdata-standby
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  hostPath:
    path: /var/lib/k8s-pgdata-standby
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [rhein-k8s-s2-2698bv3-k620-8-128]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-standby
  namespace: cozyroom-k8s
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: k8s-pgdata-standby
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-standby
  namespace: cozyroom-k8s
spec:
  serviceName: postgres-standby
  replicas: 1
  selector:
    matchLabels:
      app: postgres-standby
  template:
    metadata:
      labels:
        app: postgres-standby
    spec:
      nodeSelector:
        kubernetes.io/hostname: rhein-k8s-s2-2698bv3-k620-8-128
      initContainers:
        - name: init-replica
          image: postgres:16-alpine
          command:
            - bash
            - -c
            - |
              echo "Waiting for primary..."
              until pg_isready -h postgres -U cozyroom; do sleep 2; done
              echo "Primary ready. Running pg_basebackup..."
              rm -rf /var/lib/postgresql/data/*
              PGPASSWORD=replpass pg_basebackup \
                -h postgres \
                -U replicator \
                -D /var/lib/postgresql/data \
                -P \
                -R \
                --wal-method=stream
              echo "Basebackup done."
          volumeMounts:
            - name: pgdata-standby
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: cozyroom
            - name: POSTGRES_USER
              value: cozyroom
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cozyroom-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata-standby
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, cozyroom]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: pgdata-standby
          persistentVolumeClaim:
            claimName: pgdata-standby
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-standby
  namespace: cozyroom-k8s
spec:
  selector:
    app: postgres-standby
  ports:
    - port: 5432
      targetPort: 5432
